name: AegisScan CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Exercise CLI against vulnerable examples
        run: |
          aegisscan version
          aegisscan rules
          aegisscan scan examples/vulnerable --fail-on none --json aegisscan-report.json
