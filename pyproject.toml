[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisscan-cloud-security"
version = "0.2.0"
description = "AegisScan - cloud and IaC security scanner for Terraform and Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Turki Aldheam"}]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "PyYAML>=6.0,<7.0",
  "python-hcl2>=5.1,<8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0"
]

[project.scripts]
aegisscan = "aegisscan.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisscan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/aegisscan/cli.py" = ["B008"]
"src/aegisscan/models.py" = ["I001"]
"src/aegisscan/rules.py" = ["BLE001", "I001", "SIM102", "UP035"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
